<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TBOX</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      max-width: 1000px;
      margin: 0 auto 24px auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-box {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .logo-box:hover {
      transform: rotate(8deg) scale(1.08);
    }
    .logo-box img { width: 100%; height: 100%; object-fit: cover; }

    .title-box h1 { font-size: 1.15rem; font-weight: 700; color: #ffffff; }
    .title-box p { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    /* NÚT DISCORD BẤM NẢY MƯỢT */
    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #5865f2;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      margin-left: auto;
      box-shadow: 0 4px 12px rgba(88, 101, 242, 0.3);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .discord-btn:hover { 
      background-color: #4752c4;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(88, 101, 242, 0.45);
    }
    .discord-btn:active { transform: translateY(1px) scale(0.97); }
    .discord-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    /* NÚT QUAY LẠI CÓ ANIMATION */
    .back-btn {
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }
    .back-btn:hover { 
      background-color: #334155; 
      border-color: #6366f1;
      transform: translateX(-4px);
    }
    .back-btn:active { transform: translateX(-2px) scale(0.96); }
    .hidden { display: none !important; }

    /* LƯỚI THƯ MỤC VÀ LƯỚI ẢNH */
    .grid-layout {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 600px) { .grid-layout { grid-template-columns: repeat(3, 1fr); gap: 20px; } }
    @media (min-width: 900px) { .grid-layout { grid-template-columns: repeat(4, 1fr); } }

    /* HIỆU ỨNG THẺ THƯ MỤC VÀ CARD ẢNH */
    .folder-card, .card {
      background: #1e293b;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #334155;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      
      /* Hiệu ứng hiển thị Fade-In ban đầu */
      animation: fadeInUp 0.4s ease forwards;
    }

    .folder-card:hover, .card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: #818cf8;
      box-shadow: 0 12px 25px -5px rgba(99, 102, 241, 0.25);
    }

    .folder-cover-wrapper, .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      position: relative;
      background: #020617;
    }

    .folder-cover, .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Hiệu ứng Zoom ảnh khi rê chuột */
    .folder-card:hover .folder-cover, 
    .card:hover img {
      transform: scale(1.1);
    }

    .folder-info, .card-title {
      padding: 12px;
      text-align: center;
    }
    .folder-name { font-size: 0.9rem; font-weight: 600; color: #f1f5f9; }
    .folder-count { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    .card-title {
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #cbd5e1;
    }

    /* LIGHTBOX HIỆU ỨNG BLUR & ZOOM POPUP */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99;
      
      /* Mặc định ẩn bằng opacity và hiệu ứng mờ */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .lightbox.active .lightbox-content {
      transform: scale(1);
    }

    .lightbox img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .lightbox-close:hover {
      background: rgba(239, 68, 68, 0.8);
      border-color: transparent;
      transform: rotate(90deg);
    }

    .lightbox-title {
      margin-top: 16px;
      font-size: 0.95rem;
      color: #f1f5f9;
      text-align: center;
      font-weight: 500;
    }

    .share-btn {
      margin-top: 14px;
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .share-btn:hover { 
      background-color: #6366f1; 
      border-color: #818cf8;
      transform: translateY(-2px);
    }
    .share-btn:active { transform: translateY(0); }

    /* ANIMATION KEYFRAMES */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <div class="logo-box">
        <img src="ảnh/HVTykhBbsAAyJZC.jpg" alt="Logo" onerror="this.outerHTML='📁';">
      </div>
      <div class="title-box">
        <h1 id="header-title">Thư Mục Ảnh Của Tôi</h1>
        <p id="header-subtitle">Chọn thư mục để xem</p>
      </div>
    </div>

    <a href="https://discord.gg/zsDjYZdF" target="_blank" class="discord-btn">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.14ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74c6.51,0,11.66,5.77,11.44,12.74C53.89,60,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74c6.4,0,11.53,5.77,11.31,12.74C96.01,60,91,65.69,84.69,65.69Z"/>
      </svg>
      Discord
    </a>
  </header>

  <div class="container">
    <button id="back-btn" class="back-btn hidden">← Quay lại</button>
    <div id="main-display" class="grid-layout"></div>
  </div>

  <!-- LIGHTBOX VỚI KHUNG ANIMATION CONTENT -->
  <div id="lightbox" class="lightbox">
    <button class="lightbox-close" id="close-btn">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-img" src="" alt="">
      <div id="lightbox-title" class="lightbox-title"></div>
      <button class="share-btn" id="share-btn"> copy link này</button>
    </div>
  </div>

  <script>
    const folders = [
      {
        id: "rieng-tu",
        name: "Ảnh Riêng Tư",
        cover: "ảnh/images 1.jpg",
        images: [
          { id: 1, url: "ảnh/images 1.jpg", title: "12:56 24/10/2016" },
          { id: 2, url: "ảnh/images 2.jpg", title: "12:57 24/10/2026" }
        ]
      },
      {
        id: "kho-shitouboushu007",
        name: "Kho (X) shitouboushu007",
        cover: "ảnh/shitouboushu007-01.jpg",
        images: [
          { id: 3, url: "ảnh/shitouboushu007-01.jpg", title: "13:35 27/10/2026" },
          { id: 4, url: "ảnh/shitouboushu007-02.jpg", title: "13:35 27/10/2026" },
          { id: 5, url: "ảnh/shitouboushu007-03.jpg", title: "13:37 27/10/2026" },
          { id: 6, url: "ảnh/shitouboushu007-04.jpg", title: "13:37 27/10/2026" }
        ]
      }
    ];

    const displayEl = document.getElementById('main-display');
    const backBtn = document.getElementById('back-btn');
    const headerTitle = document.getElementById('header-title');
    const headerSubtitle = document.getElementById('header-subtitle');

    let currentFolder = null;

    function renderFolders() {
      currentFolder = null;
      headerTitle.textContent = "Thư Mục Ảnh Của Tôi";
      headerSubtitle.textContent = `${folders.length} thư mục`;
      backBtn.classList.add('hidden');
      displayEl.innerHTML = '';

      folders.forEach((folder, index) => {
        const div = document.createElement('div');
        div.className = 'folder-card';
        // Tạo độ trễ animation tăng dần cho từng phần tử
        div.style.animationDelay = `${index * 0.08}s`;
        div.innerHTML = `
          <div class="folder-cover-wrapper">
            <img src="${folder.cover}" alt="${folder.name}" class="folder-cover" loading="lazy">
          </div>
          <div class="folder-info">
            <div class="folder-name">${folder.name}</div>
            <div class="folder-count">${folder.images.length} ảnh</div>
          </div>
        `;
        div.addEventListener('click', () => renderGallery(folder));
        displayEl.appendChild(div);
      });
    }

    function renderGallery(folder) {
      currentFolder = folder;
      headerTitle.textContent = folder.name;
      headerSubtitle.textContent = `${folder.images.length} ảnh`;
      backBtn.classList.remove('hidden');
      displayEl.innerHTML = '';

      folder.images.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = `${index * 0.08}s`;
        card.innerHTML = `
          <div class="card-img-wrapper">
            <img src="${item.url}" alt="${item.title}" loading="lazy">
          </div>
          <div class="card-title">${item.title}</div>
        `;
        card.addEventListener('click', () => {
          window.location.hash = `folder-${folder.id}-anh-${item.id}`;
          openLightbox(item);
        });
        displayEl.appendChild(card);
      });
    }

    backBtn.addEventListener('click', renderFolders);

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxTitle = document.getElementById('lightbox-title');
    const shareBtn = document.getElementById('share-btn');

    function openLightbox(item) {
      lightboxImg.src = item.url;
      lightboxTitle.textContent = item.title;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      if (currentFolder) {
        window.location.hash = `folder-${currentFolder.id}`;
      } else {
        history.pushState("", document.title, window.location.pathname + window.location.search);
      }
    }

    document.getElementById('close-btn').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    shareBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      shareBtn.textContent = "✅ Đã copy link!";
      setTimeout(() => { shareBtn.textContent = "copy link này"; }, 2000);
    });

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash.includes('folder-')) {
        const parts = hash.replace('#folder-', '').split('-anh-');
        const folderId = parts[0];
        const imgId = parseInt(parts[1]);

        const targetFolder = folders.find(f => f.id === folderId);
        if (targetFolder) {
          renderGallery(targetFolder);
          if (imgId) {
            const targetImg = targetFolder.images.find(img => img.id === imgId);
            if (targetImg) openLightbox(targetImg);
          }
          return;
        }
      }
      renderFolders();
    });
  </script>
</body>
</html>
