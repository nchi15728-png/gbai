<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ảnh Riêng Tư</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }

    /* HEADER: LOGO VÀ TÊN Ở GÓC TRÊN BÊN TRÁI */
    header {
      max-width: 1000px;
      margin: 0 auto 24px auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
    }

    .brand-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* ĐÃ SỬA LỖI CLASS TẠI ĐÂY */
    .logo-box {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      overflow: hidden;
    }

    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .title-box h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
    }
    .title-box p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    /* NÚT DISCORD GỌN GÀNG BÊN PHẢI/GÓC TRÊN */
    .discord-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #5865f2;
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background-color 0.2s, transform 0.1s;
      margin-left: auto;
    }
    .discord-btn:hover { background-color: #4752c4; }
    .discord-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* LƯỚI ẢNH */
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 1000px;
      margin: 0 auto;
    }
    @media (min-width: 600px) {
      .gallery { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    @media (min-width: 900px) {
      .gallery { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid #334155;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #6366f1;
    }
    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }
    .card-title {
      padding: 10px;
      font-size: 0.8rem;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #cbd5e1;
    }

    /* LIGHTBOX PHÓNG TO ẢNH */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 99;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 8px;
    }
    .lightbox-close {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }
    .lightbox-title {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #e2e8f0;
      text-align: center;
    }

    /* Nút copy link xem ảnh */
    .share-btn {
      margin-top: 12px;
      background-color: #334155;
      color: #f8fafc;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .share-btn:hover { background-color: #475569; }
  </style>
</head>
<body>

  <!-- HEADER: LOGO + TÊN GÓC TRÊN BÊN TRÁI -->
  <header>
    <div class="brand-container">
      <!-- ĐÃ SỬA: Hiển thị hình ảnh logo góc trái -->
      <div class="logo-box">
        <img src="ảnh/HVTykhBbsAAyJZC.jpg" alt="Logo" onerror="this.outerHTML='🖼️';">
      </div>
      <div class="title-box">
        <h1>ảnh riêng tư</h1>
        <p id="total-count">2 ảnh</p>
      </div>
    </div>

    <!-- NÚT DISCORD -->
    <a href="https://discord.gg/zsDjYZdF" target="_blank" class="discord-btn">
      <svg viewBox="0 0 127.14 96.36">
        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.91-72.14ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74c6.51,0,11.66,5.77,11.44,12.74C53.89,60,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74c6.4,0,11.53,5.77,11.31,12.74C96.01,60,91,65.69,84.69,65.69Z"/>
      </svg>
      Discord
    </a>
  </header>

  <!-- LƯỚI ẢNH -->
  <div id="gallery" class="gallery"></div>

  <!-- LIGHTBOX (PHÓNG TO ẢNH) -->
  <div id="lightbox" class="lightbox">
    <button class="lightbox-close" id="close-btn">&times;</button>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-title" class="lightbox-title"></div>
    <button class="share-btn" id="share-btn">🔗 Sao chép link ảnh này</button>
  </div>

  <script>
    // ✏️ DANH SÁCH ẢNH CỦA BẠN (Thêm/bớt ảnh trực tiếp tại đây)
    const baseImages = [
      { id: 1, url: "ảnh/images 1.jpg", title: "12:56" },
      { id: 2, url: "ảnh/images 2.jpg", title: "12:57" }
    ];

    // Tự động cập nhật số lượng ảnh hiển thị ở Header
    document.getElementById('total-count').textContent = `${baseImages.length} ảnh`;

    // Render danh sách ảnh
    const galleryEl = document.getElementById('gallery');
    baseImages.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${item.url}" alt="${item.title}" loading="lazy">
        <div class="card-title">${item.title}</div>
      `;
      card.addEventListener('click', () => {
        window.location.hash = `anh-${item.id}`;
        openLightbox(item);
      });
      galleryEl.appendChild(card);
    });

    // Xử lý Lightbox
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxTitle = document.getElementById('lightbox-title');
    const shareBtn = document.getElementById('share-btn');

    function openLightbox(item) {
      lightboxImg.src = item.url;
      lightboxTitle.textContent = item.title;
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      history.pushState("", document.title, window.location.pathname + window.location.search);
    }

    document.getElementById('close-btn').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Tính năng chép link nhanh khi đẩy lên GitHub Pages
    shareBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(window.location.href);
      shareBtn.textContent = "✅ Đã chép link!";
      setTimeout(() => { shareBtn.textContent = "🔗 Sao chép link ảnh này"; }, 2000);
    });

    // Tự mở ảnh nếu người khác bấm vào link chia sẻ (ví dụ: #anh-1)
    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash.startsWith('#anh-')) {
        const id = parseInt(hash.replace('#anh-', ''));
        const found = baseImages.find(img => img.id === id);
        if (found) openLightbox(found);
      }
    });
  </script>
</body>
</html>
